[project]
name = "casmsim"
version = "1.0.0"
description = "gRPC/Arrow Flight runner transport for CASMSocial agent-based models"
authors = [{ name = "Jon C. Cline", email = "jcline@mitre.org" }]
readme = "README.md"
license = "MIT"
keywords = ["abm", "grpc", "arrow", "casmsocial", "simulation"]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
# Install to use the CasmPopAdapter (wraps casmsocial CasmPop models).
# casmsocial itself is not declared here because casmsim must be importable
# without it — the adapter does a lazy import at run time.
casmsocial = ["casmsocial>=3.0.0"]

[project.urls]
Homepage = "https://ccgsem.github.io/casmsim/"
Repository = "https://github.com/ccgsem/casmsim"
Documentation = "https://ccgsem.github.io/casmsim/"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=9.1.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "tox-uv>=1.35.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casmsim", "proto", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["casmsim"]
combine_as_imports = true

[tool.mypy]
files = ["casmsim"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true
extend-exclude = ["casmsim/proto"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["casmsim"]
